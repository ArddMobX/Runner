name: Build Android APK

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Ensure Gradle Wrapper
        run: |
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            echo "Downloading gradle-wrapper.jar..."
            curl -sLo gradle/wrapper/gradle-wrapper.jar https://raw.githubusercontent.com/gradle/gradle/v8.7.0/gradle/wrapper/gradle-wrapper.jar || gradle wrapper --gradle-version 8.7
          fi
          chmod +x gradlew

      - name: Build Debug APK
        id: build
        continue-on-error: true
        run: |
          set +e
          ./gradlew assembleDebug generateApkSha256 --stacktrace 2>&1 | tee build.log
          status=${PIPESTATUS[0]}
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit $status

      # Логи GitHub Actions закрыты авторизацией, поэтому при падении выкладываем
      # выжимку из build.log в отдельную ветку ci-errors. Её читает агент через git fetch.
      - name: Publish build errors
        if: steps.build.outcome == 'failure'
        run: |
          mkdir -p .ci
          {
            echo "# Ошибка сборки"
            echo
            echo "- commit: ${GITHUB_SHA}"
            echo "- ref: ${GITHUB_REF_NAME}"
            echo "- date: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo
            echo "## Строки ошибок"
            echo '```'
            grep -nE '^e: |What went wrong|^> |^Caused by|Execution failed|FAILURE:|Unresolved reference|error:' build.log | head -150 || true
            echo '```'
            echo
            echo "## Хвост лога"
            echo '```'
            tail -120 build.log || true
            echo '```'
          } > .ci/last-build-error.txt

          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add -f .ci/last-build-error.txt
          git commit -m "ci: лог ошибки сборки [skip ci]" || true
          git push --force origin HEAD:ci-errors || true

      - name: Upload Debug APK Artifact
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: Runner-Debug-APK-${{ github.run_number }}
          path: |
            app/build/outputs/apk/debug/Runner-*.apk
            app/build/outputs/apk/debug/*.sha256
          if-no-files-found: error
          overwrite: false

      - name: Create GitHub Release
        if: steps.build.outcome == 'success' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "Runner v1.0.${{ github.run_number }} APK"
          body: "Автоматическая сборка APK автономного ИИ-агента Runner для Android."
          files: |
            app/build/outputs/apk/debug/Runner-*.apk
            app/build/outputs/apk/debug/*.sha256
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Fail if build failed
        if: steps.build.outcome == 'failure'
        run: |
          echo "Сборка упала. Выжимка из лога — в ветке ci-errors, файл .ci/last-build-error.txt"
          exit 1
