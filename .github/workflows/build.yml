name: Build Android APK

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

# contents: write нужен и для ветки ci-errors (выжимка из лога падения),
# и для публикации релиза.
permissions:
  contents: write

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    # Секреты подписи лежат в среде release-signing, а не в общих секретах
    # репозитория. Причина: workflow срабатывает на пуш в ЛЮБУЮ ветку, и если
    # ключ доступен всегда, то любой, кто может запушить ветку, способен
    # подписать своим кодом APK, неотличимый для системы обновлений.
    # Среда позволяет ограничить доступ (required reviewers, ограничение
    # по веткам). Пока среды нет, секреты не резолвятся: собирается только debug.
    environment: release-signing

    steps:
      # Экшены запинены на коммит-SHA, а не на тег: тег можно переставить,
      # а workflow имеет права на запись в репозиторий.
      - name: Checkout Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # Проверяет, что gradle-wrapper.jar — официальный, а не подменённый.
      # jar лежит в репозитории; шаг, который тянул его curl-ом с
      # raw.githubusercontent без сверки суммы, удалён.
      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Check signing secrets
        id: signing
        env:
          SEC_KEYSTORE: ${{ secrets.KEYSTORE_BASE64 }}
          SEC_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          SEC_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          SEC_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          # Печатаем длину каждого значения: пустая строка и незаполненный
          # секрет выглядят одинаково («не задан»), а длины их различают.
          # Сами значения не показываются никогда.
          row() {
            local name="$1" value="$2"
            if [ -z "$value" ]; then
              echo "| $name | ПУСТО (0) |"
            else
              echo "| $name | задан, ${#value} симв. |"
            fi
          }

          {
            echo "### Секреты подписи"
            echo
            echo "| Секрет | Состояние |"
            echo "|---|---|"
            row "KEYSTORE_BASE64" "$SEC_KEYSTORE"
            row "KEYSTORE_PASSWORD" "$SEC_STORE_PASSWORD"
            row "KEY_ALIAS" "$SEC_KEY_ALIAS"
            row "KEY_PASSWORD" "$SEC_KEY_PASSWORD"
            echo
          } >> "$GITHUB_STEP_SUMMARY"

          # Мастер-ключ проверяем по-настоящему: он обязан декодироваться в JKS.
          if [ -n "$SEC_KEYSTORE" ]; then
            printf '%s' "$SEC_KEYSTORE" | base64 -d > /tmp/probe.jks
            echo "base64 декодируется в $(stat -c%s /tmp/probe.jks) байт"
            rm -f /tmp/probe.jks
          fi

          if [ -z "$SEC_KEYSTORE" ]; then
            echo "::warning::KEYSTORE_BASE64 не подставлен — релиз собираться не будет."
            echo "Проверьте, что секреты добавлены именно в среду release-signing"
            echo "(Settings -> Environments -> release-signing -> Add secret),"
            echo "а не в общие секреты репозитория."
          fi

          # Проверяем каждый секрет поимённо. Раньше отсутствие KEY_PASSWORD
          # давало невнятное «SigningConfig release is missing required property
          # keyPassword» уже в конце сборки, спустя минуты компиляции.
          missing=0
          for pair in "KEYSTORE_PASSWORD:$SEC_STORE_PASSWORD" "KEY_ALIAS:$SEC_KEY_ALIAS" "KEY_PASSWORD:$SEC_KEY_PASSWORD" "KEYSTORE_BASE64:$SEC_KEYSTORE"; do
            name="${pair%%:*}"
            value="${pair#*:}"
            if [ -z "$value" ]; then
              echo "::error::Секрет $name не подставлен или пуст."
              missing=1
            fi
          done

          if [ "$missing" = "1" ]; then
            {
              echo "### Подпись не настроена"
              echo
              echo "В среде release-signing не хватает секретов (см. таблицу выше)."
              echo "Нужны все четыре: KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD."
              echo "Учтите: KEY_PASSWORD (пароль ключа) и KEYSTORE_PASSWORD (пароль хранилища) —"
              echo "это два разных секрета, даже если пароли совпадают."
              echo
              echo "Пока их нет, собирается только debug-вариант."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "ok=$([ "$missing" = "0" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      # Ключ подписи кладётся в файл вне рабочего каталога, чтобы не попасть
      # ни в git, ни в артефакты.
      - name: Decode signing keystore
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "Секрет KEYSTORE_BASE64 не задан — release собираться не будет."
            exit 0
          fi
          mkdir -p "$RUNNER_TEMP/signing"
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/signing/release.jks"
          echo "configured=true" >> "$GITHUB_OUTPUT"
          echo "размер ключа: $(stat -c%s "$RUNNER_TEMP/signing/release.jks") байт"

      # Свойства подписи передаются Gradle через ORG_GRADLE_PROJECT_* — этот
      # механизм Gradle поддерживает штатно, без разбора файла свойств.
      #
      # Почему не через RUNNER_*: GitHub Actions резервирует префикс RUNNER_,
      # и такие переменные до шага не доходят. Из-за этого сборка видела
      # расшифрованный ключ, но считала подпись ненастроенной.
      #
      # Пароли передаются не значением, а через файлы: значение с обратным
      # слешем, двоеточием или переводом строки сломало бы разбор свойств.
      - name: Configure signing properties
        if: steps.keystore.outputs.configured == 'true'
        env:
          STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS_VALUE: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD_VALUE: ${{ secrets.KEY_PASSWORD }}
        run: |
          mkdir -p "$RUNNER_TEMP/signing"
          printf '%s' "$STORE_PASSWORD" > "$RUNNER_TEMP/signing/store.txt"
          printf '%s' "$KEY_PASSWORD_VALUE" > "$RUNNER_TEMP/signing/key.txt"
          printf '%s' "$KEY_ALIAS_VALUE" > "$RUNNER_TEMP/signing/alias.txt"
          ls -l "$RUNNER_TEMP/signing/"

      - name: Build APK
        id: build
        continue-on-error: true
        env:
          ORG_GRADLE_PROJECT_RUNNER_KEYSTORE_PATH: ${{ runner.temp }}/signing/release.jks
          ORG_GRADLE_PROJECT_RUNNER_KEYSTORE_PASSWORD_FILE: ${{ runner.temp }}/signing/store.txt
          ORG_GRADLE_PROJECT_RUNNER_KEY_ALIAS_FILE: ${{ runner.temp }}/signing/alias.txt
          ORG_GRADLE_PROJECT_RUNNER_KEY_PASSWORD_FILE: ${{ runner.temp }}/signing/key.txt
        run: |
          set +e
          chmod +x gradlew

          TASKS="assembleDebug"
          # Release собирается, только если ключ подписи реально доступен
          # и все четыре секрета подставлены.
          if [ "${{ steps.signing.outputs.ok }}" = "true" ]; then
            TASKS="assembleDebug assembleRelease"
          else
            echo "Секреты подписи неполные — release не собираю, будет только debug."
          fi

          ./gradlew $TASKS generateApkSha256 \
            -PrunnerVersionCode="${{ github.run_number }}" \
            -PrunnerVersionName="1.0.${{ github.run_number }}" \
            --stacktrace 2>&1 | tee build.log
          status=${PIPESTATUS[0]}
          echo "status=$status" >> "$GITHUB_OUTPUT"

          # Логи шагов закрыты авторизацией, поэтому при падении выкладываем
          # хвост вывода в сводку прогона: сводка читается публично.
          # Секреты GitHub маскирует в выводе автоматически.
          if [ "$status" != "0" ]; then
            {
              echo "### Сборка упала (код $status)"
              echo
              echo '```'
              # Секция «What went wrong» идёт сразу после FAILURE и содержит
              # сам текст ошибки — он важнее хвоста стека.
              awk '/What went wrong/,/^\* Try:|^\* Get more help|^BUILD FAILED/' build.log | head -40
              echo '--- хвост вывода ---'
              tail -25 build.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

          exit $status

      # Логи GitHub Actions закрыты авторизацией, поэтому при падении выкладываем
      # выжимку из build.log в отдельную ветку ci-errors. Её читает агент через git fetch.
      #
      # Шаг защищён `continue-on-error`: диагностика не должна ронять прогон.
      # Раньше здесь стояло `|| true` только у push, и падение публикации лога
      # само становилось причиной красного прогона (так и случилось в #50).
      - name: Publish build errors
        if: steps.build.outcome == 'failure'
        continue-on-error: true
        run: |
          mkdir -p .ci
          {
            echo "# Ошибка сборки"
            echo
            echo "- commit: ${GITHUB_SHA}"
            echo "- ref: ${GITHUB_REF_NAME}"
            echo "- date: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo
            echo "## Строки ошибок"
            echo '```'
            grep -nE '^e: |What went wrong|^> |^Caused by|Execution failed|FAILURE:|Unresolved reference|error:' build.log | head -150 || true
            echo '```'
            echo
            echo "## Хвост лога"
            echo '```'
            tail -120 build.log || true
            echo '```'
          } > .ci/last-build-error.txt

          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add -f .ci/last-build-error.txt
          git commit -m "ci: лог ошибки сборки [skip ci]" || true
          # force нужен именно здесь. Ветка ci-errors — одноразовая витрина
          # последней ошибки, её история не ценна, а накопленный хвост делает
          # обычный push не fast-forward. В #50 отсутствие force уронило прогон
          # на этом шаге: сборка была успешной, а красным стал лог падения.
          git push --force origin HEAD:ci-errors

      # Debug-сборка остаётся артефактом для проверки на устройстве, но
      # в релизы не попадает: у неё общеизвестный ключ и debuggable=true.
      - name: Upload Debug APK Artifact
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Runner-Debug-APK-${{ github.run_number }}
          path: |
            app/build/outputs/apk/debug/Runner-*.apk
            app/build/outputs/apk/debug/*.sha256
          if-no-files-found: error
          overwrite: false

      - name: Upload Release APK Artifact
        if: steps.build.outcome == 'success' && steps.keystore.outputs.configured == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Runner-Release-APK-${{ github.run_number }}
          path: |
            app/build/outputs/apk/release/Runner-*.apk
            app/build/outputs/apk/release/*.sha256
          if-no-files-found: error
          overwrite: false

      # Публичный релиз. Только release-вариант и только на main.
      - name: Verify release APK is signed
        id: verify
        if: steps.build.outcome == 'success' && steps.keystore.outputs.configured == 'true'
        run: |
          APK=$(ls app/build/outputs/apk/release/Runner-*.apk | head -1)
          echo "apk=$APK" >> "$GITHUB_OUTPUT"
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort | tail -1)
          echo "apksigner: $APKSIGNER"
          "$APKSIGNER" verify --print-certs "$APK" | tee certs.txt
          # Отладочный ключ начинается с CN=Android Debug — такой релиз выпускать нельзя.
          if grep -q "CN=Android Debug" certs.txt; then
            echo "::error::Release APK подписан отладочным ключом"
            exit 1
          fi

      - name: Create GitHub Release
        if: steps.build.outcome == 'success' && steps.verify.outcome == 'success' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "Runner v1.0.${{ github.run_number }}"
          body: |
            Автоматическая сборка APK автономного ИИ-агента Runner для Android.

            APK подписан ключом проекта и устанавливается поверх предыдущих версий.
            Рядом лежит `.sha256` — сверьте его после скачивания.
          files: |
            app/build/outputs/apk/release/Runner-*.apk
            app/build/outputs/apk/release/*.sha256
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Report checksums
        if: steps.build.outcome == 'success'
        run: |
          {
            echo "### APK"
            echo '```'
            cat app/build/outputs/apk/debug/*.sha256 2>/dev/null || true
            cat app/build/outputs/apk/release/*.sha256 2>/dev/null || true
            echo '```'
            if [ "${{ steps.keystore.outputs.configured }}" = "true" ]; then
              echo "Release подписан и опубликован в Releases."
            else
              echo "Секрет KEYSTORE_BASE64 не задан: собран только debug."
              echo "Чтобы включить релизы, добавьте секреты KEYSTORE_BASE64,"
              echo "KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove keystore
        if: always()
        run: rm -rf "$RUNNER_TEMP/signing"

      - name: Fail if build failed
        if: steps.build.outcome == 'failure'
        run: |
          echo "Сборка упала. Выжимка из лога — в ветке ci-errors, файл .ci/last-build-error.txt"
          exit 1
